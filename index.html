<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 색상 미리보기 — Re:Al 플래너</title>
<style>
  :root {
    --page-bg: #f8fafc;
    --text: #0f172a;
    --muted: #64748b;
    --border: #e2e8f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--page-bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 24px 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  header h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  .axis-legend {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 16px;
  }
  .axis-chip {
    font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--border);
    background: #fff;
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 8px 24px 48px;
    display: grid;
    gap: 20px;
  }
  .program-card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15,23,42,.06);
  }
  .program-head {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
  }
  .brand-dot {
    width: 44px; height: 44px; border-radius: 12px;
    flex-shrink: 0;
    border: 1px solid rgba(0,0,0,.08);
  }
  .program-title { font-size: 16px; font-weight: 800; margin: 0; }
  .program-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .program-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  @media (max-width: 860px) {
    .program-body { grid-template-columns: 1fr; }
  }
  .section {
    padding: 16px 18px;
  }
  .section + .section {
    border-left: 1px solid var(--border);
  }
  @media (max-width: 860px) {
    .section + .section { border-left: none; border-top: 1px solid var(--border); }
  }
  .section h3 {
    margin: 0 0 10px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .4px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 72px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.06);
    cursor: pointer;
    transition: transform .12s;
  }
  .swatch:hover { transform: translateY(-2px); }
  .swatch-color { height: 44px; }
  .swatch-label {
    font-size: 9px; font-weight: 700;
    padding: 4px 6px;
    background: #fafafa;
    color: #334155;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .swatch-hex {
    font-size: 9px; font-family: ui-monospace, monospace;
    padding: 0 6px 5px;
    background: #fafafa;
    color: #64748b;
  }
  .mock-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }
  .mock-label {
    font-size: 10px; font-weight: 700; color: var(--muted);
    margin-bottom: 6px;
  }
  /* 망고 슬라이드 미니 목업 */
  .mango-mock {
    aspect-ratio: 4/5;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
    position: relative;
  }
  .mango-mock .head {
    font-size: 13px; font-weight: 800; line-height: 1.35;
    margin-bottom: 8px;
  }
  .mango-mock .bullet {
    font-size: 9px; line-height: 1.5; opacity: .85;
  }
  .mango-mock .card {
    margin-top: auto;
    padding: 8px;
    border-radius: 6px;
    font-size: 8px;
  }
  .mango-mock .divider {
    height: 2px; width: 32px; margin: 6px 0;
    border-radius: 1px;
  }
  /* 썸네일 스크림 미니 목업 */
  .thumb-mock {
    aspect-ratio: 4/5;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.08);
    position: relative;
    background: linear-gradient(160deg, #cbd5e1 0%, #94a3b8 100%);
  }
  .thumb-mock .photo {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.15) 0%, transparent 40%);
  }
  .thumb-mock .scrim {
    position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px;
  }
  .thumb-mock .hero {
    font-size: 11px; font-weight: 800; color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,.4);
    line-height: 1.25;
  }
  .thumb-mock .tag {
    font-size: 8px; color: rgba(255,255,255,.85);
    margin-top: 3px;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #0f172a; color: #fff; font-size: 12px; font-weight: 600;
    padding: 8px 16px; border-radius: 999px; opacity: 0;
    transition: opacity .2s; pointer-events: none; z-index: 99;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>프로그램 색상 미리보기</h1>
  <p>navy · gold · devon · green + 전문가 변형 — 망고보드 · 썸네일 · 탭 브랜드색</p>
  <div class="axis-legend" id="axisLegend"></div>
</header>
<main id="grid"></main>
<div class="toast" id="toast">복사됨</div>

<script>
const DATA = [
  { id:0, name:'도수치료', axis:'navy', audience:'일반인',
    brand:'#3A5080',
    mango:{ bg:'#eef1f6', bg2:'#e6ebf3', head:'#1e2a44', point:'#3a5080', card:'#f4f6fa', card2:'#eef1f7', divider:'#1e2a44', desc:'남색·신뢰·임상' },
    thumb:{ tint:'#1e2a44', tint2:'#3A5080', glow:'#3a5080' },
    hero:'Re:Al Manual Therapy', tag:'의학적 관점으로 다시 보는 몸의 구조' },
  { id:1, name:'리:얼 무브먼트', axis:'devon', audience:'일반인',
    brand:'#8B7355',
    mango:{ bg:'#F9EBD2', bg2:'#F3E4C4', head:'#1A1A1A', point:'#5C5346', card:'#FBF6EC', card2:'#F7F0E0', divider:'#1A1A1A', desc:'데본크림·블랙·웜 스톤' },
    thumb:{ tint:'#1A1A1A', tint2:'#8B7355', glow:'#5C5346' },
    hero:'Re:Al Movement', tag:'의학적 관점으로 다시 보는 움직임' },
  { id:2, name:'리:얼 페이스', axis:'gold', audience:'일반인',
    brand:'#D4A853',
    mango:{ bg:'#f0efeb', bg2:'#eee9de', head:'#3d2c27', point:'#6b493d', card:'#f7efe9', card2:'#f5ebe4', divider:'#3d2c27', desc:'소프트 아이보리·웜 골드' },
    thumb:{ tint:'#3d2c27', tint2:'#D4A853', glow:'#6b493d' },
    hero:'Re:Al Face', tag:'구조로 다시 보는 얼굴' },
  { id:3, name:'CMT Academy', axis:'navy-expert', audience:'전문가',
    brand:'#1E3A5F',
    mango:{ bg:'#E8EDF5', bg2:'#DDE4F0', head:'#0F172A', point:'#4F46E5', card:'#F0F4FA', card2:'#E5EBF5', divider:'#0F172A', desc:'딥 네이비·인디고·교육' },
    thumb:{ tint:'#0F172A', tint2:'#1E3A5F', glow:'#4F46E5' },
    hero:'CMT Academy', tag:'임상에서 다시 보는 도수치료' },
  { id:4, name:'IFC 얼굴교육', axis:'gold-expert', audience:'전문가',
    brand:'#A67C52',
    mango:{ bg:'#F5EDE4', bg2:'#EDE3D6', head:'#5C3D2E', point:'#9E4B5A', card:'#FAF6F0', card2:'#F3EBE2', divider:'#5C3D2E', desc:'앤티크 골드·로즈브론즈' },
    thumb:{ tint:'#5C3D2E', tint2:'#A67C52', glow:'#9E4B5A' },
    hero:'국제얼굴교정학회', tag:'구조 교정으로 다시 보는 얼굴' },
  { id:5, name:'Re:Al 움직임 과정', axis:'devon-expert', audience:'전문가',
    brand:'#64748B',
    mango:{ bg:'#EDE8DF', bg2:'#E2DDD4', head:'#1E293B', point:'#475569', card:'#F5F2EC', card2:'#EBE6DD', divider:'#1E293B', desc:'쿨 데본·슬레이트·과정' },
    thumb:{ tint:'#1E293B', tint2:'#64748B', glow:'#475569' },
    hero:'Re:Al 움직임 과정', tag:'교육 현장에서 다시 보는 움직임' },
  { id:6, name:'일상 공유', axis:'green', audience:'팔로워·일상',
    brand:'#3D8B6A',
    mango:{ bg:'#eef7f2', bg2:'#e3f0e9', head:'#1f3d32', point:'#3d8b6a', card:'#f4faf6', card2:'#ebf5ef', divider:'#1f3d32', desc:'소프트 그린·일상' },
    thumb:{ tint:'#1f3d32', tint2:'#3D8B6A', glow:'#3d8b6a' },
    hero:'REAL LIFE', tag:'일상 속에서 다시 보는 몸' },
  { id:7, name:'힐자계', axis:'green-bright', audience:'입주민',
    brand:'#34D399',
    mango:{ bg:'#ECFDF5', bg2:'#D1FAE5', head:'#14532D', point:'#059669', card:'#F0FDF4', card2:'#DCFCE7', divider:'#14532D', desc:'에메랄드·커뮤니티' },
    thumb:{ tint:'#14532D', tint2:'#34D399', glow:'#059669' },
    hero:'REAL CARE', tag:'입주민을 위한 셀프 케어' },
  { id:8, name:'지점·브랜딩', axis:'indigo', audience:'운영',
    brand:'#6366F1',
    mango:{ bg:'#EEF2FF', bg2:'#E0E7FF', head:'#312E81', point:'#6366F1', card:'#F5F7FF', card2:'#EEF2FF', divider:'#312E81', desc:'인디고·운영' },
    thumb:{ tint:'#312E81', tint2:'#6366F1', glow:'#6366F1' },
    hero:'REAL MOVEMENT', tag:'진짜 움직임, 몸의 재정렬' }
];

const AXIS_LABELS = {
  navy:'navy', devon:'devon', gold:'gold', green:'green',
  'navy-expert':'navy-expert', 'gold-expert':'gold-expert',
  'devon-expert':'devon-expert', 'green-bright':'green-bright', indigo:'indigo'
};

function swatch(label, hex) {
  return `<div class="swatch" data-hex="${hex}" title="클릭하면 hex 복사">
    <div class="swatch-color" style="background:${hex}"></div>
    <div class="swatch-label">${label}</div>
    <div class="swatch-hex">${hex.toUpperCase()}</div>
  </div>`;
}

function thumbGradient(t) {
  return `linear-gradient(180deg, transparent 0%, ${t.tint}88 35%, ${t.tint2}cc 70%, ${t.tint}ee 100%)`;
}

const grid = document.getElementById('grid');
const legend = document.getElementById('axisLegend');
const seen = new Set();
DATA.forEach(p => {
  if (!seen.has(p.axis)) {
    seen.add(p.axis);
    const chip = document.createElement('span');
    chip.className = 'axis-chip';
    chip.textContent = p.axis;
    chip.style.borderColor = p.brand + '55';
    chip.style.color = p.brand;
    legend.appendChild(chip);
  }
});

DATA.forEach(p => {
  const m = p.mango;
  const t = p.thumb;
  const card = document.createElement('article');
  card.className = 'program-card';
  card.innerHTML = `
    <div class="program-head">
      <div class="brand-dot" style="background:${p.brand}"></div>
      <div>
        <p class="program-title">${p.name}</p>
        <p class="program-meta">${p.axis} · ${p.audience} · 탭 브랜드 ${p.brand.toUpperCase()}</p>
      </div>
    </div>
    <div class="program-body">
      <div class="section">
        <h3>망고보드 팔레트 · ${m.desc}</h3>
        <div class="swatches">
          ${swatch('배경 bg', m.bg)}
          ${swatch('배경2 bg2', m.bg2)}
          ${swatch('헤드 head', m.head)}
          ${swatch('포인트 point', m.point)}
          ${swatch('카드 card', m.card)}
          ${swatch('카드2 card2', m.card2)}
          ${swatch('구분선 divider', m.divider)}
          ${swatch('탭 brand', p.brand)}
        </div>
        <div class="mock-row">
          <div>
            <div class="mock-label">망고 슬라이드 목업</div>
            <div class="mango-mock" style="background:linear-gradient(180deg,${m.bg} 0%,${m.bg2} 100%);color:${m.head}">
              <div class="head">허리가 뻐근한<br>진짜 이유</div>
              <div class="divider" style="background:${m.divider}"></div>
              <div class="bullet">• 관절과 연부조직이 함께<br>• 쉬운 말로 설명</div>
              <div class="card" style="background:${m.card};color:${m.point}">STEP · 주의 카드</div>
            </div>
          </div>
          <div>
            <div class="mock-label">썸네일 스크림 · tint / tint2 / glow</div>
            <div class="swatches" style="margin-bottom:10px">
              ${swatch('tint', t.tint)}
              ${swatch('tint2', t.tint2)}
              ${swatch('glow', t.glow)}
            </div>
            <div class="thumb-mock">
              <div class="photo"></div>
              <div class="scrim" style="background:${thumbGradient(t)}">
                <div class="hero">${p.hero}</div>
                <div class="tag">${p.tag}</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  grid.appendChild(card);
});

const toast = document.getElementById('toast');
let toastTimer;
document.body.addEventListener('click', e => {
  const sw = e.target.closest('.swatch');
  if (!sw) return;
  const hex = sw.dataset.hex;
  navigator.clipboard.writeText(hex).then(() => {
    toast.textContent = hex.toUpperCase() + ' 복사됨';
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  });
});
</script>
</body>
</html>
